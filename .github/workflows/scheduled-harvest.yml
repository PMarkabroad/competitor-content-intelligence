# The whole pipeline on a timer, so Monday opens on new competitor data AND
# new hooks and posts made from it -- not just fresh rows.
#
# Three runs every Sunday, staggered so each starts after the last has
# finished:
#
#   19:00 UTC  harvest T2   32 TikTok + 6 Instagram
#   20:00 UTC  harvest T3   19 Instagram
#   21:00 UTC  content      transcribe -> hooks -> ready-made posts
#
# Plus a monthly discovery sweep on the 26th, which looks for competitors we
# do not track yet and stops at a shortlist. It never promotes: passing the
# gate means an account is healthy, not that it is a competitor. Of 45
# accounts that passed every automated check, hand review kept 22; of the
# next 79, none. A travel vlogger with 424k followers passes every gate
# there is.
#
# The 26th because the Apify billing cycle resets on the 25th, so the sweep
# meets a full budget rather than whatever the month left behind.
#
# Sunday 21:00 UTC is Monday 07:00 in Melbourne (08:00 under daylight
# saving), so everything has landed before anyone opens the dashboard.
#
# T1 is deliberately absent -- it is exempt from scoring, so an automatic
# run would spend money producing nothing.
name: Scheduled harvest

on:
  schedule:
    - cron: "0 19 * * 0" # T2 harvest
    - cron: "0 20 * * 0" # T3 harvest
    - cron: "0 21 * * 0" # content chain
    - cron: "0 18 26 * *" # monthly discovery sweep
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "content"
        type: choice
        options: ["T2", "T3", "content", "discover"]

# One at a time. Overlapping runs would double-spend against a cap check
# that cannot see the other run in flight, and the content chain assumes
# the harvests before it have finished.
concurrency:
  group: scheduled-harvest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: competitor-pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: competitor-pipeline/package-lock.json

      - run: npm ci

      # A scheduled run carries no inputs, so the cron expression that fired
      # is what decides which mode this is.
      - name: Resolve mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 19 * * 0" ]; then
            echo "value=T2" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 20 * * 0" ]; then
            echo "value=T3" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 18 26 * *" ]; then
            echo "value=discover" >> "$GITHUB_OUTPUT"
          else
            echo "value=content" >> "$GITHUB_OUTPUT"
          fi

      - name: Harvest
        if: steps.mode.outputs.value == 'T2' || steps.mode.outputs.value == 'T3'
        run: npm run scheduled-harvest -- --tier ${{ steps.mode.outputs.value }}

      # --- monthly discovery ---------------------------------------------
      # Five stages, all machine work, stopping before the sixth. Each Apify
      # stage checks real month-to-date spend against the cap and skips
      # rather than failing if it cannot afford to run -- --confirm alone is
      # no longer a guard once it is a flag in a YAML file.
      - name: Discover candidates
        if: steps.mode.outputs.value == 'discover'
        continue-on-error: true
        run: |
          npm run discover -- --search --confirm
          npm run discover -- --profile --confirm
          npm run discover -- --classify
          npm run discover -- --gate --confirm
          npm run discover -- --shortlist

      # The shortlist is the deliverable. Kept as an artifact so the
      # candidates can be reviewed without anyone re-running the sweep.
      - name: Upload shortlist for review
        if: steps.mode.outputs.value == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: discovery-shortlist-${{ github.run_id }}
          path: competitor-pipeline/out/discovery_shortlist_*.csv
          if-no-files-found: warn
          retention-days: 90

      # --- content chain -------------------------------------------------
      # Each step continues on error. A failure here should cost one stage,
      # not the whole night: if transcription dies, the hooks that already
      # have transcripts should still get tagged, and posts should still be
      # written from the hooks that already exist.

      # Instagram only. TikTok speech-to-text was measured returning EMPTY
      # on every subtitle-less video while still billing, so it is not
      # retried. Bounded by --limit so a week with an unusual number of
      # outliers cannot quietly drain the Apify budget; the spend guard
      # inside the script is the other half of that.
      - name: Transcribe new outliers
        if: steps.mode.outputs.value == 'content'
        continue-on-error: true
        run: npm run transcribe-outliers -- --instagram --limit=25

      # Turns transcripts (and short TikToks, from their captions) into hook
      # rows. Filters job listings, visa/nationality content and non-English
      # before spending a model call. Anthropic cost only.
      - name: Draft hook tags
        if: steps.mode.outputs.value == 'content'
        continue-on-error: true
        run: npm run draft-hook-tags

      # Eight posts a week, each written out for all nine channels -- the
      # count is capped deliberately. Anthropic has no spend ceiling the way
      # Apify does, and an unbounded weekly generator would pile up drafts
      # faster than anyone can publish them. generate-from-analysis chains
      # into generate-formats itself.
      - name: Generate ready-made posts
        if: steps.mode.outputs.value == 'content'
        continue-on-error: true
        run: npm run generate-from-analysis -- --count=8

      # Catches any draft whose chained format call failed above.
      - name: Backfill missing channel versions
        if: steps.mode.outputs.value == 'content'
        continue-on-error: true
        run: npm run generate-formats

      # Kept whether the run passed, failed or was skipped for budget --
      # a budget skip exits 0 by design, and the log is the only record.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ steps.mode.outputs.value }}-${{ github.run_id }}
          path: competitor-pipeline/logs/
          if-no-files-found: ignore
          retention-days: 30
